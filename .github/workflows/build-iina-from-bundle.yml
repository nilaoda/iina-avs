name: Build IINA from custom libmpv bundle

on:
  workflow_call:
    inputs:
      bundle_repo:
        type: string
        default: 'nilaoda/mpv-iina-avs'
      bundle_tag:
        type: string
        default: ''
      publish_release:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      bundle_repo:
        description: 'Repository that publishes the libmpv bundle release'
        required: true
        type: string
        default: 'nilaoda/mpv-iina-avs'
      bundle_tag:
        description: 'Release tag containing the libmpv bundle (leave empty for latest)'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Publish the packaged IINA apps to GitHub Releases'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to publish to (leave empty to auto-generate)'
        required: false
        type: string

env:
  FFMPEG_VERSION: '9.0.1'
  MPV_VERSION: 'v0.41.0'
  LICENSE_FLAVOR: gpl

jobs:
  metadata:
    runs-on: macos-26
    outputs:
      bundle_tag: ${{ steps.meta.outputs.bundle_tag }}
      bundle_release_url: ${{ steps.meta.outputs.bundle_release_url }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Resolve bundle and release metadata
        id: meta
        env:
          BUNDLE_REPO: ${{ inputs.bundle_repo }}
          INPUT_BUNDLE_TAG: ${{ inputs.bundle_tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_BUNDLE_TAG:-}" ]]; then
            bundle_tag="$INPUT_BUNDLE_TAG"
            bundle_release_url="https://github.com/${BUNDLE_REPO}/releases/tag/${bundle_tag}"
          else
            bundle_release_url="$(curl -fsSL -o /dev/null -w '%{url_effective}' "https://github.com/${BUNDLE_REPO}/releases/latest")"
            bundle_tag="${bundle_release_url##*/}"
          fi

          bundle_slug="$(printf '%s' "$bundle_tag" | tr '/ :' '---')"
          if [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="iina-${bundle_slug}-$(date -u +%Y%m%d-%H%M%S)"
          fi
          release_name="IINA from ${bundle_tag}"

          echo "bundle_tag=$bundle_tag" >> "$GITHUB_OUTPUT"
          echo "bundle_release_url=$bundle_release_url" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare matching custom libraries and headers
        env:
          ARCH: ${{ matrix.arch }}
          BUNDLE_REPO: ${{ inputs.bundle_repo }}
          BUNDLE_TAG: ${{ needs.metadata.outputs.bundle_tag }}
          BUNDLE_ASSET: iina-mpv-bundle-macos-${{ matrix.arch }}-${{ env.LICENSE_FLAVOR }}-ffmpeg-${{ env.FFMPEG_VERSION }}-mpv-${{ env.MPV_VERSION }}.zip
          YT_DLP_DOWNLOAD_URL: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
        run: |
          set -euo pipefail
          bundle_root="$RUNNER_TEMP/custom-bundle"
          mkdir -p "$bundle_root" deps/executable
          bundle_url="https://github.com/${BUNDLE_REPO}/releases/download/${BUNDLE_TAG}/${BUNDLE_ASSET}"
          curl -fL --retry 3 "$bundle_url" -o "$RUNNER_TEMP/$BUNDLE_ASSET"
          unzip -q "$RUNNER_TEMP/$BUNDLE_ASSET" -d "$bundle_root"
          python3 other/custom_bundle.py prepare \
            --bundle "$bundle_root" --arch "$ARCH" \
            --ffmpeg-version "$FFMPEG_VERSION" --mpv-ref "$MPV_VERSION"
          curl -fL --retry 3 "$YT_DLP_DOWNLOAD_URL" -o deps/executable/youtube-dl
          chmod +x deps/executable/youtube-dl

      - name: Build IINA (${{ matrix.arch }})
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project iina.xcodeproj \
            -scheme iina \
            -configuration Nightly \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS="$ARCH" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Compute packaging metadata
        id: package_meta
        env:
          ARCH: ${{ matrix.arch }}
          BUNDLE_ASSET: iina-mpv-bundle-macos-${{ matrix.arch }}-${{ env.LICENSE_FLAVOR }}-ffmpeg-${{ env.FFMPEG_VERSION }}-mpv-${{ env.MPV_VERSION }}.zip
        run: |
          set -euo pipefail
          asset_stub="${BUNDLE_ASSET%.zip}"
          archive_name="IINA-${asset_stub}.tar.xz"
          artifact_name="IINA-${asset_stub}"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE_PATH=${{ runner.temp }}/$archive_name" >> "$GITHUB_ENV"

      - name: Verify packaged library versions and dependencies
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 other/custom_bundle.py verify-app \
            --app "$DERIVED_DATA/Build/Products/Nightly/IINA.app" --arch "$ARCH"

      - name: Re-sign app bundle
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Nightly/IINA.app"
          APP_FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          test -d "$APP_PATH"

          find "$APP_FRAMEWORKS" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' dylib; do
            codesign --force --sign - --timestamp=none "$dylib"
          done

          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package app
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Nightly/IINA.app"
          test -d "$APP_PATH"
          tar cJf "$ARCHIVE_PATH" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_meta.outputs.artifact_name }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ inputs.publish_release }}
    needs:
      - metadata
      - build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: IINA-*
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: |
          set -euo pipefail
          ls -la release-files/

      - name: Generate release body
        id: release_notes
        env:
          BUNDLE_RELEASE_URL: ${{ needs.metadata.outputs.bundle_release_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import os

          body = (
              "## What's Changed\n"
              "\n"
              "- Rebuilt IINA app bundles for `arm64` and `x86_64`\n"
              f"- Built with: {os.environ['BUNDLE_RELEASE_URL']}\n"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("body<<__EOF__\n")
              fh.write(body)
              fh.write("__EOF__\n")
          PY2

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: ${{ needs.metadata.outputs.release_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: release-files/*.tar.xz
